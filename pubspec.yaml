name: shiptrack
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1
  firebase_messaging: ^15.1.3

  # Maps
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Geocoding via HTTP
  http: ^1.2.2

  # Notifications
  flutter_local_notifications: ^18.0.1

  # Utils
  url_launcher: ^6.3.1

  # State management
  provider: ^6.1.2

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  fluttertoast: ^8.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true